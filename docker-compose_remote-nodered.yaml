services:

# ---------------------------------------------------------------
# Node-RED OPC UA client
# ---------------------------------------------------------------

  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      - TZ=Europe/Berlin
    volumes:
      # Persistent Node-RED data
      - ./node-red:/data
    networks:
      static-network:
        ipv4_address: 10.200.1.121

# ---------------------------------------------------------------
# Volumes and networks
# ---------------------------------------------------------------

volumes:
  nodered_data:

networks:
  static-network:
    ipam:
      config:
        - subnet: 10.200.1.0/24
          gateway: 10.200.1.1