groups:
  - name: container-rules
    interval: 10s
    rules:
      # === CPU Usage (% per container) ===
      - record: container:cpu_usage:rate5m
        expr: |
          rate(container_cpu_usage_seconds_total[5m]) * 100

      # === Memory Usage (bytes per container) ===
      - record: container:memory_usage:bytes
        expr: container_memory_usage_bytes

      # === Memory Working Set (bytes) ===
      - record: container:memory_working_set:bytes
        expr: container_memory_working_set_bytes

      # === Network Receive (bytes/s) ===
      - record: container:network_receive:rate5m
        expr: |
          rate(container_network_receive_bytes_total[5m])

      # === Network Transmit (bytes/s) ===
      - record: container:network_transmit:rate5m
        expr: |
          rate(container_network_transmit_bytes_total[5m])
