services:
# Gateway-Applications:
  # Central M+O Application
  s32g3-central-mo-client:
    container_name: s32g3-central-mo-client
    build: central-mo-client/
    volumes:
      - type: bind
        source: ./central-mo-client/logs
        target: /app/logs
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    attach: true
    network_mode: "host"
