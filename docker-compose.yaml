services:

# ---------------------------------------------------------------
# Database — mirrors the RPi MariaDB setup exactly:
#   - utf8mb4 / utf8mb4_unicode_ci throughout
#   - users vor-1 (write) and vor-2 (read+delete)
#   - get_next_request stored procedure with explicit COLLATE
#   - init SQL sourced from ./maria-db/
# ---------------------------------------------------------------

  mariadb:
    container_name: siot-mariadb
    build: maria-db/
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      MARIADB_DATABASE: "secure_iot_gateway"
      # Passed into 01_init.sql via envsubst so CREATE USER uses the
      # same passwords the partition containers receive — no hardcoding.
      MARIADB_VOR1_PASSWORD: "${MARIADB_VOR1_PASSWORD}"
      MARIADB_VOR2_PASSWORD: "${MARIADB_VOR2_PASSWORD}"
      # Force the same charset/collation as the RPi server config
      # (equivalent to setting character-set-server and collation-server
      # in /etc/mysql/mariadb.conf.d/50-server.cnf on the RPi).
      MARIADB_CHARACTER_SET_SERVER: "utf8mb4"
      MARIADB_COLLATION_SERVER: "utf8mb4_unicode_ci"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    attach: false
    networks:
      static-network:
        ipv4_address: 192.168.178.117


# ---------------------------------------------------------------
# Emulated CPC applications
# ---------------------------------------------------------------

  brownfield-opcua-server:
    container_name: brownfield-opcua-server
    build: brownfield-opcua-server/
    volumes:
      - type: bind
        source: ./brownfield-opcua-server/logs
        target: /app/logs
      - type: bind
        source: ./.runtime-secrets/brownfield-opcua-server
        target: /run/siot-secrets/brownfield-opcua-server
        read_only: true
    attach: false
    environment:
      SIOT_DEPLOYMENT_MODE: "${SIOT_DEPLOYMENT_MODE:-production}"
      ENABLE_INSECURE_OPCUA_TEST_SERVER: "${ENABLE_INSECURE_OPCUA_TEST_SERVER:-false}"
    networks:
      static-network:
        ipv4_address: 192.168.178.118

  ecotec-modbus-server:
    container_name: ecotec-modbus-server
    image: oitc/modbus-server@sha256:58a9e9b97b994a2bbfb79bbe43e25387a2e6c458220b44cd058007af3881c243
    command: -f /server_config_v2.json
    volumes:
      - ./modbus-server/server_config_v2.json:/server_config_v2.json:ro
    attach: false
    networks:
      static-network:
        ipv4_address: 192.168.178.181


# ---------------------------------------------------------------
# Gateway applications
# ---------------------------------------------------------------

  interface-partition:
    container_name: interface-partition
    build: interface-partition/
    volumes:
      - type: bind
        source: ./interface-partition/logs
        target: /app/logs
      - type: bind
        source: ./.runtime-secrets/interface-partition
        target: /run/siot-secrets/interface-partition
        read_only: true
      - type: bind
        source: ./.runtime-data/interface-partition
        target: /var/lib/siot
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      SIOT_CREDENTIALS_DB: /var/lib/siot/credentials.json
      ALLOW_LEGACY_CREDENTIALS: "false"
      AUTHZ_MODE: "${AUTHZ_MODE:-casbin}"
      OPA_URL: "${OPA_URL:-http://opa:8181/v1/data/siot/authz/allow}"
      OPA_FAIL_OPEN: "${OPA_FAIL_OPEN:-false}"
      OPA_TIMEOUT_SECONDS: "${OPA_TIMEOUT_SECONDS:-0.75}"
      OPA_PUMP_B_POWER_MAX_KW: "${OPA_PUMP_B_POWER_MAX_KW:-16}"
      SIOT_DEPLOYMENT_MODE: "${SIOT_DEPLOYMENT_MODE:-production}"
      GRPC_CLIENT_HOST: intermediate-vor-partition
    ports:
      - 4840:4840
    attach: true
    networks:
      static-network:
        ipv4_address: 192.168.178.112

  intermediate-vor-partition:
    container_name: intermediate-vor-partition
    build: intermediate-vor-partition/
    volumes:
      - type: bind
        source: ./intermediate-vor-partition/logs
        target: /app/logs
      - type: bind
        source: ./.runtime-secrets/intermediate-vor-partition
        target: /run/siot-secrets/intermediate-vor-partition
        read_only: true
    environment:
      DB_USER: "vor-1"
      DB_PASSWORD: "${MARIADB_VOR1_PASSWORD}"
      DB_HOST: mariadb
      PIPELINE_MODE: "${PIPELINE_MODE:-mariadb}"
      INTERMEDIATE_VOR_GRPC_CERT_BASE: /run/siot-secrets/intermediate-vor-partition/certificates/grpc
    depends_on:
      mariadb:
        condition: service_healthy
      interface-partition:
        condition: service_started
    attach: false
    networks:
      static-network:
        ipv4_address: 192.168.178.115

  intermediate-vor-partition-cpc:
    container_name: intermediate-vor-partition-cpc
    build: intermediate-vor-partition-cpc/
    volumes:
      - type: bind
        source: ./intermediate-vor-partition-cpc/config/Acceptance_Ruleset_with_affected_endpoints.xml
        target: /app/config/Acceptance_Ruleset_with_affected_endpoints.xml
      - type: bind
        source: ./intermediate-vor-partition-cpc/logs
        target: /app/logs
      - type: bind
        source: ./.runtime-secrets/intermediate-vor-partition-cpc
        target: /run/siot-secrets/intermediate-vor-partition-cpc
        read_only: true
    environment:
      DB_USER: "vor-2"
      DB_PASSWORD: "${MARIADB_VOR2_PASSWORD}"
      DB_HOST: mariadb
    depends_on:
      mariadb:
        condition: service_healthy
      intermediate-vor-partition:
        condition: service_started
      cpc-partition:
        condition: service_started
    attach: false
    networks:
      static-network:
        ipv4_address: 192.168.178.116

  psmo-partition:
    container_name: psmo-partition
    build: psmo-partition/
    volumes:
      - type: bind
        source: ./psmo-partition/logs
        target: /app/logs
      - type: bind
        source: ./.runtime-secrets/psmo-partition
        target: /run/siot-secrets/psmo-partition
        read_only: true
    attach: false
    networks:
      static-network:
        ipv4_address: 192.168.178.113

  cpc-partition:
    container_name: cpc-partition
    build: cpc-partition/
    volumes:
      - type: bind
        source: ./cpc-partition/logs
        target: /app/logs
      - type: bind
        source: ./.runtime-secrets/cpc-partition
        target: /run/siot-secrets/cpc-partition
        read_only: true
    ipc: "shareable"
    depends_on:
      brownfield-opcua-server:
        condition: service_started
      ecotec-modbus-server:
        condition: service_started
      psmo-partition:
        condition: service_started
      interface-partition:
        condition: service_started
    attach: false
    networks:
      static-network:
        ipv4_address: 192.168.178.114

  central-mo-client:
    container_name: central-mo-client
    build: central-mo-client/
    profiles: ["demo"]
    volumes:
      - type: bind
        source: ./central-mo-client/logs
        target: /app/logs
      - type: bind
        source: ./.runtime-secrets/central-mo-client
        target: /run/siot-secrets/central-mo-client
        read_only: true
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      interface-partition:
        condition: service_started
    attach: false
    networks:
      static-network:
        ipv4_address: 192.168.178.31

  e2e-runner:
    build: central-mo-client/
    profiles: ["e2e"]
    command: ["python3", "-u", "./e2e_runner.py"]
    volumes:
      - type: bind
        source: ./central-mo-client/logs
        target: /app/logs
      - type: bind
        source: ./.runtime-secrets/central-mo-client
        target: /run/siot-secrets/central-mo-client
        read_only: true
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    depends_on:
      interface-partition:
        condition: service_started
    networks:
      static-network: {}

  opa:
    container_name: opa
    image: openpolicyagent/opa@sha256:cba27d3c6af2feba1e4d6e6b5e24df5b53db332420d4148a90acccd12efae6ed
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies/policy.rego"]
    volumes:
      - type: bind
        source: ./evaluation/opa-spike/policy.rego
        target: /policies/policy.rego
        read_only: true
    attach: false
    networks:
      static-network:
        ipv4_address: 192.168.178.40



