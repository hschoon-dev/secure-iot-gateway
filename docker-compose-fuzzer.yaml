services:
# Gateway-Applications:
  # Application of the gateway's Interface Partition
  interface-partition:
    container_name: interface-partition
    build: interface-partition/
    volumes:
      # Logging files
      - type: bind
        source: ./interface-partition/logs
        target: /app/logs
    environment:
      - ADMIN_PASSWORD=1234
    ports:
      - 4840:4840
    attach: false
    networks:
      static-network:
        ipv4_address: 192.168.156.12


  # Intermediate VoR Partition
  intermediate-vor-partition:
    container_name: intermediate-vor-partition
    build: intermediate-vor-partition/
    volumes:
      # Database for mapped requests
      - type: bind
        #source: ./intermediate-vor-partition/config/mapped_requests.db
        source: ./vor-database/mapped_requests.json
        #target: /app/config/mapped_requests.db
        target: /mnt/mapped_requests.json
      # Logging files
      - type: bind
        source: ./intermediate-vor-partition/logs
        target: /app/logs
    depends_on:
      interface-partition: 
        condition: service_started
    attach: false
    networks:
      static-network:
        ipv4_address: 192.168.156.15

  # Second Intermediate VoR Partition
  intermediate-vor-partition-cpc:
    container_name: intermediate-vor-partition-cpc
    build: intermediate-vor-partition-cpc/
    volumes:
      # Database for mapped requests
      - type: bind
        #source: ./intermediate-vor-partition/config/mapped_requests.db
        source: ./vor-database/mapped_requests.json
        #target: /app/config/mapped_requests.db
        target: /mnt/mapped_requests.json
      # Configuration file for modified acceptance ruleset
      - type: bind
        source: ./intermediate-vor-partition-cpc/config/Acceptance_Ruleset_modified.xml
        target: /app/config/Acceptance_Ruleset_modified.xml
      # Logging files
      - type: bind
        source: ./intermediate-vor-partition-cpc/logs
        target: /app/logs
    depends_on:
      intermediate-vor-partition: 
        condition: service_started
      cpc-partition:
        condition: service_started
    attach: true
    networks:
      static-network:
        ipv4_address: 192.168.156.16

  # Application of the gateway's psM+O Partition
  psmo-partition:
    container_name: psmo-partition
    #ipc: "service:cpc-partition"
    build: psmo-partition/
    volumes:
      # Logging files
      - type: bind
        source: ./psmo-partition/logs
        target: /app/logs
    attach: false
    networks:
      static-network:
        ipv4_address: 192.168.156.13

  # Application of the gateway's CPC Partition
  cpc-partition:
    container_name: cpc-partition 
    build: cpc-partition/
    volumes:
      # Logging files
      - type: bind
        source: ./cpc-partition/logs
        target: /app/logs
    ipc: "shareable"
    depends_on:
       psmo-partition:
         condition: service_started
       interface-partition:
         condition: service_started
    attach: true
    networks:
      static-network:
          ipv4_address: 192.168.156.14

  opcua-network-fuzzer:
    container_name: opcua-network-fuzzer
    build:
      context: opcua_network_fuzzer/
      dockerfile: ../opcua_network_fuzzer.Dockerfile
      args:
        REQUEST_TYPE: ${FUZZER_REQUEST_TYPE}
    ports:
      - 26000:${FUZZER_PORT}
    volumes:
      - type: bind
        source: ${FUZZER_LOGS}
        target: /app/logs
      - type: bind
        source: ${FUZZER_RESULTS}
        target: /app/boofuzz-results
    depends_on:
      interface-partition:
        condition: service_started
    networks:
      static-network:
        ipv4_address: 192.168.156.17

networks:
  static-network:
    ipam:
      config:
        - subnet: 192.168.156.0/24
          gateway: 192.168.156.1