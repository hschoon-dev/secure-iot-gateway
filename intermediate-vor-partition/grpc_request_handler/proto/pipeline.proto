syntax = "proto3";
package pipeline;

message EndpointRule {
  string name = 1;
  string change_type = 2;
  string unit = 3;
  string condition = 4;
}

message MappedRequest {
  string request_id = 1;
  string generation_timestamp = 2;
  repeated string description = 3;
  string impact = 4;
  int32 priority = 5;
  repeated EndpointRule endpoints = 6;
}

message ProcessResponse {
  bool success = 1;
  string message = 2;
  repeated EndpointValue applied_values = 3;
}

message ReadValuesRequest {
  repeated string names = 1;
}

message EndpointValue {
  string name = 1;
  string value = 2;
}

message ReadValuesResponse {
  bool success = 1;
  string message = 2;
  repeated EndpointValue values = 3;
}

message ApplyRequest {
  string request_id = 1;
  repeated EndpointValue values = 2;
}

message ApplyResponse {
  bool success = 1;
  string message = 2;
}

message StatusRequest {
  string request_id = 1;
}

message StatusResponse {
  bool found = 1;
  bool success = 2;
  string message = 3;
  repeated EndpointValue applied_values = 4;
}

service ProcessingService {
  rpc Process(MappedRequest) returns (ProcessResponse);
}

service CpcService {
  rpc ReadValues(ReadValuesRequest) returns (ReadValuesResponse);
  rpc Apply(ApplyRequest) returns (ApplyResponse);
  rpc GetStatus(StatusRequest) returns (StatusResponse);
}
