# Mounted read-only from the config volume at /mnt/config/intermediate-vor-partition
# (see docker-compose.yaml). All paths below are relative to this directory.

rulesets:
  verification_ruleset: Request_Verification_Ruleset.xml
  mapping_ruleset: Mapping_Rulesets.xml

grpc_server:
  port: 50051
  max_workers: 10
  grace_period_seconds: 5
  certs:
    ca_cert: certificates/grpc/ca/ca.crt
    server_cert: certificates/grpc/server/server.crt
    server_key: certificates/grpc/server/server.key

# Outbound mTLS gRPC client that forwards mapped requests directly to
# intermediate-vor-partition-cpc. Replaces the previous shared-database
# write (MariaDB, then a shared SQLite file) — this partition no longer
# stores anything itself.
mapped_request_client:
  host: "10.200.1.178"
  port: 50052
  timeout_seconds: 5.0
  certs:
    ca_cert: certificates/grpc/ca/ca.crt
    client_cert: certificates/grpc/client/client.crt
    client_key: certificates/grpc/client/client.key

logging:
  log_file: logs/app.log
  log_level: INFO
  max_bytes: 1048576   # 1 MB
  backup_count: 3
