# Mounted read-only from the config volume at /mnt/config/cpc-partition
# (see docker-compose.yaml). All paths below are relative to this directory.

opcua:
  interval: 1
  files:
    xml_config: opcua-endpoints_demonstrator.xml
    xsd_schema: opcua-endpoints.xsd
  shared_memory:
    name: opcua_shm
    size: 10240        # 1024 * 10 bytes
  semaphore:
    name: opcua_semaphore
  grpc_targets:
    # Keys must be valid Python identifiers to match the GrpcTargets Pydantic model.
    interface_partition: 10.200.1.174:50051
    psmo_partition: 10.200.1.175:50051

modbustcp:
  interval: 1
  files:
    xml_config: modbustcp-endpoints_demonstrator.xml
    xsd_schema: modbustcp-endpoints.xsd
  shared_memory:
    name: modbus_shm
    size: 12288        # 1024 * 12 bytes
  semaphore:
    name: modbus_semaphore
  grpc_targets:
    # Keys must be valid Python identifiers to match the GrpcTargets Pydantic model.
    interface_partition: 10.200.1.174:50051
    psmo_partition: 10.200.1.175:50051

flask_bridge:
  host: "0.0.0.0"
  port: 5000
  debug: false
  threaded: true

grpc_certs:
  ca_cert: certs/ca/ca.crt
  client_cert: certs/client/client.crt
  client_key: certs/client/client.key

logging:
  log_file: logs/app.log
  log_level: INFO
  max_bytes: 1048576   # 1 MB
  backup_count: 3