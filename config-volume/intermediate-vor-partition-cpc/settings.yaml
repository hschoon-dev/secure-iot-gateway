# Mounted read-only from the config volume at /mnt/config/intermediate-vor-partition-cpc
# (see docker-compose.yaml). All paths below are relative to this directory,
# except sqlite.database, which is resolved against the app's own
# (writable) directory instead — see config_loader.py.

acceptance_rulesets:
  ruleset: Acceptance_Ruleset.xml
  ruleset_modified: Acceptance_Ruleset_modified.xml

# Inbound mTLS gRPC server that receives mapped requests forwarded directly
# by intermediate-vor-partition. Replaces the previous shared-database read
# (MariaDB, then a shared SQLite file).
mapped_request_server:
  port: 50052
  max_workers: 10
  grace_period_seconds: 5
  certs:
    ca_cert: certificates/grpc/ca/ca.crt
    server_cert: certificates/grpc/server/server.crt
    server_key: certificates/grpc/server/server.key

sqlite:
  # Local-only: private to this partition, no Docker volume. Plain file on
  # disk, relative to this app directory (NOT the read-only config
  # volume) — same layout when running directly on a Linux VM. Requests
  # arrive via mapped_request_server above and are stored here.
  database: "db_manager/mapped_requests.db"
  busy_timeout_ms: 10000

flask_bridge:
  host: "10.200.1.176"
  port: 5000
  read_values_path: /read_values_xml
  update_endpoints_path: /update_endpoints
  timeout_seconds: 5.0

processing:
  idle_sleep_seconds: 0.5
  startup_delay_seconds: 2.0

logging:
  log_file: logs/app.log
  log_level: DEBUG
  max_bytes: 1048576   # 1 MB
  backup_count: 3
